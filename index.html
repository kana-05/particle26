<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Magic Star Trail</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        cursor: none; /* デフォルトカーソル消す */
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let mouse = {
    x: canvas.width / 2,
    y: canvas.height / 2
};

window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // 粒発生
    for (let i = 0; i < 8; i++) {
        particles.push(new Particle(mouse.x, mouse.y));
    }
});

class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = 40 + Math.random() * 20;

        // 大粒ミックス
        if (Math.random() < 0.2) {
            this.size = Math.random() * 4 + 3;
        } else {
            this.size = Math.random() * 2 + 1;
        }

        this.hue = Math.random() * 360;
        this.alpha = 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.95;
        this.vy *= 0.95;

        this.life--;
        this.alpha = this.life / 60;
    }

    draw() {
        let gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.size * 4
        );

        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.alpha})`);
        gradient.addColorStop(0.4, `hsla(${this.hue}, 100%, 60%, ${this.alpha * 0.8})`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);

        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
        ctx.fill();

        // 中心キラ
        ctx.beginPath();
        ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, 1)`;
        ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ★ 星を描く関数
function drawStar(x, y, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(x, y - outerRadius);

    for (let i = 0; i < spikes; i++) {
        ctx.lineTo(
            x + Math.cos(rot) * outerRadius,
            y + Math.sin(rot) * outerRadius
        );
        rot += step;

        ctx.lineTo(
            x + Math.cos(rot) * innerRadius,
            y + Math.sin(rot) * innerRadius
        );
        rot += step;
    }

    ctx.lineTo(x, y - outerRadius);
    ctx.closePath();
    ctx.fill();
}

const particles = [];

ctx.globalCompositeOperation = "lighter";

function animate() {
    // ★ 完全クリア（残像なし）
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // パーティクル
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].life <= 0) {
            particles.splice(i, 1);
        }
    }

    // ★ マウス先の星
    ctx.fillStyle = "rgba(255, 255, 150, 0.9)";
    drawStar(mouse.x, mouse.y, 5, 10, 5);

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
